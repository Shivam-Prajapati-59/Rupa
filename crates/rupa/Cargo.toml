[package]
name = "rupa"
description = "Rupa: a terminal agent runtime. One binary: client, daemon and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "rupa"
path = "src/main.rs"

[dependencies]
rupa-server.workspace = true
rupa-tui.workspace = true
rupa-client.workspace = true
rupa-platform.workspace = true
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
crossterm = "0.29.0"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
